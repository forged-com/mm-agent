mm: alpha
control:
  url: https://mmcp.forgd.com
source:
  kind: files
  dsn: /exports                 # directory mounted into the container; globs below are relative to it
  timezone: UTC                 # zone of naive timestamps in the rows and of the {from}/{to} dates in the globs
aliases:
  assets: {ETH: ETH, BTC: BTC}
  venues: {binance: binance, okx: okx}
  pairs: {ETH/USDT: ETH-USDT, BTC/USDT: BTC-USDT}
orders:
  query: orders/*/{asset}-*/{from}.csv     # CSV or JSONL, .gz by extension; rows outside the window are dropped
  map: {id: order_id, venue: venue, pair: pair, side: side, price: price, qty: qty, placed: placed_at, ended: closed_at}
fills:
  query: fills/*/{asset}-*/{from}.csv
  map: {venue: venue, pair: pair, order: order_id, ts: filled_at, price: price, qty: qty, side: side}
