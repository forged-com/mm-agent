[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forgd-mm-agent"
version = "0.1.0.dev0"
description = "Lands a market maker's raw orders and fills in Forgd's bucket."
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "sqlalchemy==2.1.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
mysql = ["pymysql==1.2.3"]
clickhouse = ["clickhouse-connect[sqlalchemy]==1.11.0"]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "ruff==0.16.0",
    "pytest",
    "types-jsonschema",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
forgd-mm-agent = "mm_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
extend-select = ["I", "B", "ASYNC", "DTZ", "G", "LOG", "C4", "PIE", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mm_agent"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
